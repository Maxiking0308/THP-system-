<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Texas Highway Patrol RP | Member Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="assets/js/auth.js"></script>
</head>
<body class="auth-body">
  <main class="auth-main">
    <div class="auth-card">
      <div class="logo-badge large">THP</div>
      <h1>Member Portal Login</h1>
      <p class="auth-subtitle">Access your dashboard, roster tools, and training resources.</p>

      <form class="form" id="login-form">
        <div class="form-group">
          <label for="login-username">Username or Email</label>
          <input type="text" id="login-username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary full-width">Login</button>
        <p class="form-note">
          This is a front-end placeholder. Connect it to your backend (e.g., Node, PHP, or Laravel) to validate credentials and establish sessions.
        </p>
      </form>

      <div class="auth-footer-links">
        <a href="#">Forgot password?</a>
        <a href="index.html#recruitment">Apply as a new trooper</a>
      </div>
    </div>
  </main>
</body>
</html>
